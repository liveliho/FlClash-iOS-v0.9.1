name: Build FlClash iOS v0.9.1

on:
  workflow_dispatch:
    inputs:
      native_only:
        description: Skip already verified Dart and Go regression checks
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'FlClash-v0.9.1-iOS-port.zip'
      - '.github/workflows/ios-cloud.yml'

permissions:
  contents: read

env:
  CI: 'true'
  BOT: 'true'

concurrency:
  group: ios-v091-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        working-directory: project/FlClash-v0.9.1-iOS
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Unpack pinned source
        working-directory: .
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('FlClash-v0.9.1-iOS-port.zip')
          checksum = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert checksum == '3f57c4c48da89a05b7f02dede911f7ba7aa3c9c42c670d98e2babd01b0bf3018', checksum
          with zipfile.ZipFile(archive) as source:
              assert source.testzip() is None
              source.extractall('project')
          PY
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: project/FlClash-v0.9.1-iOS/core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true
      - name: Toolchain versions
        run: |
          xcodebuild -version
          flutter --version
          go version
          rustup show
      - name: Resolve dependencies
        run: flutter pub get
      - name: Regenerate providers
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/flclash-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/flclash-pubspec.yaml" pubspec.yaml' EXIT
          python3 -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze Dart
        if: ${{ !inputs.native_only }}
        run: flutter analyze --no-fatal-infos
      - name: Go core regression tests
        if: ${{ !inputs.native_only }}
        working-directory: project/FlClash-v0.9.1-iOS/core
        run: CGO_ENABLED=0 go test .
      - name: Flutter bridge regression tests
        if: ${{ !inputs.native_only }}
        run: |
          cp pubspec.yaml "$RUNNER_TEMP/flclash-test-pubspec.yaml"
          trap 'cp "$RUNNER_TEMP/flclash-test-pubspec.yaml" pubspec.yaml' EXIT
          python3 -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
          flutter test test/plugins/service_test.dart test/core/lib_test.dart test/core/protocol_contract_test.dart test/plugins/ios_service_test.dart
      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          flutter config --enable-swift-package-manager
          flutter pub get
          python3 tool/ios/build_core.py
          test -f env.json || echo '{}' > env.json
          flutter build ios --verbose --release --no-codesign --dart-define-from-file=env.json 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
          python3 tool/ios/package_unsigned.py
      - name: Upload native build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-diagnostics
          path: ${{ runner.temp }}/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload IPA and build report
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-v0.9.1-iOS-unsigned
          path: project/FlClash-v0.9.1-iOS/dist/*
          if-no-files-found: error
          retention-days: 14
