name: ios

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        working-directory: plugins/rust_api/rust
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" \
            --profile minimal --target aarch64-apple-ios
          rustup show

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios
          workspaces: plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install ldid
        run: brew install ldid

      - name: Build Go core framework
        run: ./ios/build_core.sh

      - name: Build app
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          ./ios/package_ipa.sh "$PWD/dist/FlClash-$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)-ios-arm64.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios
          path: dist/*.ipa

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true
